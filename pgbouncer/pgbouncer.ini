[databases]
test = host=127.0.0.1 port=5432 dbname=test

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: a server connection is held only for the length of one
; transaction, so a small pool serves many clients. Each batch is one statement,
; i.e. one short transaction.
pool_mode = transaction
default_pool_size = 16
max_client_conn = 1000

; Drogon uses prepared statements. In transaction mode they only work if
; PgBouncer tracks them: needs PgBouncer >= 1.21. On older versions you will
; see "prepared statement ... does not exist" errors.
max_prepared_statements = 200

ignore_startup_parameters = extra_float_digits